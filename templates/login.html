{% extends "base.html" %}
{% block title %}Login · CommitLearn{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
    <h1 class="text-2xl font-semibold">Welcome back</h1>
    <p class="mt-2 text-sm text-slate-400">Log in to see only the commitments you created.</p>

    <form method="POST" class="mt-8 space-y-4 rounded-2xl border border-line bg-panel p-6">
        <div>
            <label for="identifier" class="mb-1 block text-sm text-slate-300">Username or email</label>
            <input id="identifier" name="identifier" required
                   class="w-full rounded-lg border border-line bg-ink px-3 py-2 text-slate-100 outline-none focus:border-emerald-500">
        </div>
        <div>
            <label for="password" class="mb-1 block text-sm text-slate-300">Password</label>
            <input id="password" name="password" type="password" required
                   class="w-full rounded-lg border border-line bg-ink px-3 py-2 text-slate-100 outline-none focus:border-emerald-500">
        </div>
        <button type="submit" class="w-full rounded-lg bg-emerald-500 py-2.5 font-medium text-ink hover:bg-emerald-400">
            Login
        </button>
    </form>
    <p class="mt-4 text-center text-sm text-slate-400">
        New here?
        <a href="{{ url_for('register') }}" class="text-emerald-400 hover:text-emerald-300">Create an account</a>
    </p>
</div>
{% endblock %}
