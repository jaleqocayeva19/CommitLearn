{% extends "base.html" %}
{% block title %}New commitment · CommitLearn{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg">
    <h1 class="text-2xl font-semibold">New commitment</h1>
    <p class="mt-2 text-sm text-slate-400">If you already have 3 active goals, this one goes to the backlog automatically.</p>

    <form method="POST" class="mt-8 space-y-4 rounded-2xl border border-line bg-panel p-6">
        <div>
            <label for="title" class="mb-1 block text-sm text-slate-300">Title</label>
            <input id="title" name="title" required
                   class="w-full rounded-lg border border-line bg-ink px-3 py-2 text-slate-100 outline-none focus:border-emerald-500">
        </div>
        <div>
            <label for="target_days" class="mb-1 block text-sm text-slate-300">Target days</label>
            <input id="target_days" name="target_days" type="number" min="1" required
                   class="w-full rounded-lg border border-line bg-ink px-3 py-2 text-slate-100 outline-none focus:border-emerald-500">
        </div>
        <div>
            <label for="checkpoint_total" class="mb-1 block text-sm text-slate-300">Checkpoint count</label>
            <input id="checkpoint_total" name="checkpoint_total" type="number" min="1" required
                   class="w-full rounded-lg border border-line bg-ink px-3 py-2 text-slate-100 outline-none focus:border-emerald-500">
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="rounded-lg bg-emerald-500 px-4 py-2 font-medium text-ink hover:bg-emerald-400">
                Create
            </button>
            <a href="{{ url_for('index') }}" class="rounded-lg border border-line px-4 py-2 text-slate-300 hover:text-white">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
